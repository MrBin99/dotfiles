theme = "onedark"

[editor]
color-modes = true
cursorline = true
editor-config = false
line-number = "relative"
popup-border = "all"
rulers = [80]
trim-trailing-whitespace = true
true-color = true

[editor.statusline]
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.file-picker]
hidden = false
